[package]
name = "giteasy"
version = "1.0.2"
description = "A beginner-friendly Git client"
authors = ["GitEasy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "giteasy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# In-place updates. Every update is signed with a key that never leaves GitHub
# Secrets, and the plugin refuses anything whose signature does not verify, so a
# tampered or spoofed release cannot install itself. `process` is what restarts
# the app once an update has been staged.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Application data — repository paths, settings, preferences. Git itself stays
# the source of truth for anything about a repository's contents or history.
# `bundled` compiles SQLite in, so there is no system library to install.
rusqlite = { version = "0.32", features = ["bundled"] }

# Native filesystem events (ReadDirectoryChangesW / FSEvents / inotify), so the
# Changes screen updates without polling the repository.
notify = "6"

# The AI features are optional and off by default; this is the only dependency
# that ever touches the network directly. `rustls` avoids linking OpenSSL.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
codegen-units = 1
lto = true
# Optimise for speed rather than size. The binary grows by a couple of
# megabytes, which matters far less than how quickly a repository opens.
opt-level = 3
panic = "abort"
strip = true
